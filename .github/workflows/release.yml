name: Release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve package from tag
        id: pkg
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync, readFileSync } from "node:fs";

          const tag = process.env.GITHUB_REF_NAME;
          const match = /^(.+)-v(.+)$/.exec(tag);
          assert.ok(match, `Tag must be <plugin>-v<version>: ${tag}`);
          const [, plugin, tagVersion] = match;
          const manifest = JSON.parse(readFileSync(`packages/${plugin}/package.json`, "utf8"));
          assert.equal(tagVersion, manifest.version, "Tag must match the package version");
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `name=${manifest.name}\nversion=${manifest.version}\n`,
          );
          NODE

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build and pack
        run: pnpm --filter "${{ steps.pkg.outputs.name }}" pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: Publish to npm
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          npm_tag=latest
          if [[ "$VERSION" == *-* ]]; then
            npm_tag=next
          fi
          pnpm publish ./artifacts/*.tgz --access public --tag "$npm_tag" --no-git-checks

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" ./artifacts/*.tgz "${args[@]}"
